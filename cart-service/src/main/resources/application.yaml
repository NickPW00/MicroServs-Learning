spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:h2:mam:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.h2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console


server:
  port: 8083

